name: Build & deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - qa
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Cache Bun
        id: cache-bun
        uses: actions/cache@v4
        env:
          cache-name: cache-bun
        with:
          path: |
            ~/.bun
            ~/.bun/install/cache
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linting
        continue-on-error: false
        run: bunx ng config -g cli.warnings.versionMismatch false && bun run lint

      - name: Build
        run: bun run build -- --configuration production

      - name: Deploy to firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KRAFT_QR }}'
          channelId: qa
          projectId: kraft-qr
